# Render Blueprint: backend API + PostgreSQL + persistent disk for uploads.
databases:
  - name: lunrea-db
    plan: free
    databaseName: lunrea

services:
  - type: web
    name: lunrea-api
    runtime: python
    plan: free               # free web services sleep when idle (first request is slow)
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: lunrea-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false          # set to your frontend URL, e.g. https://lunrea.netlify.app
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
